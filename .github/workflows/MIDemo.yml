---
name: 'MI Demo'
permissions: 
  id-token: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      arguments:
        description: 'Optional arguments for PnP such as -Handlers Lists'
        required: false
        default: ''
        type: string

jobs:
  prepare:
    name: 'Prepare environment variables'
    runs-on: ubuntu-latest
    environment: DEV
    outputs:
      sp_site_url: ${{ steps.set.outputs.sp_site_url }}
