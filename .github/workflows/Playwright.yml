name: 'E2E - Playwright Trial'

# Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment whose test user / app URL to use'
        type: choice
        required: true
        default: 'UAT'
        options:
          - DEV
          - TEST
          - UAT

permissions:
  contents: read

jobs:
  playwright:
    name: 'Run Playwright tests'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: tests/e2e
    env:
      # Use the Chrome browser already installed on the runner instead of downloading a separate Playwright browser.
      #PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_DOWNLOAD_HOST: 'https://playwright-verizon.azureedge.net'
      # App URL is a non-secret per-environment value (GitHub Environment variable).
      DEMO_APP_URL: ${{ vars.DEMO_APP_URL }}
      # Credentials for the NON-MFA test account come from Environment secrets.
      DEMO_TEST_USER: ${{ secrets.DEMO_TEST_USER }}
      DEMO_TEST_PASSWORD: ${{ secrets.DEMO_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright OS dependencies
        run: npx playwright install --with-deps chromium 

      - name: Validate required configuration
        run: |
          if [ -z "$DEMO_APP_URL" ]; then echo "::error::DEMO_APP_URL variable is not set for environment ${{ inputs.environment }}"; exit 1; fi
          if [ -z "$DEMO_TEST_USER" ]; then echo "::error::DEMO_TEST_USER secret is not set for environment ${{ inputs.environment }}"; exit 1; fi
          if [ -z "$DEMO_TEST_PASSWORD" ]; then echo "::error::DEMO_TEST_PASSWORD secret is not set for environment ${{ inputs.environment }}"; exit 1; fi
      
      - name: Check demo app env
        shell: bash
        run: |
          echo "DEMO_APP_URL set? ${DEMO_APP_URL:+yes}"
          test -n "${DEMO_APP_URL}" || { echo "Missing DEMO_APP_URL"; exit 1; }
          echo "${DEMO_APP_URL}" | sed -E 's#(https://.*?/play/.*?)(tenantId=.*)$#\1...#'
          
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.environment }}
          path: tests/e2e/playwright-report
          retention-days: 14
