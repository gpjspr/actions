Screens:
  scrHome:
    Properties:
      Fill: =ColBg
      OnVisible: =Set(locSelectedCategoryHom, "All")
    Children:
      - conRootHom:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =ColBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conHeaderHom:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =ColPrimary
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - lblTitleHom:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: ="Products"
                        Wrap: =false
                  - btnAddHom:
                      Control: Button@0.0.45
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =ColAccent
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        PaddingLeft: =20
                        PaddingRight: =20
                        Text: ="+ Add Product"
            - conSearchHom:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - txtSearchHom:
                      Control: ModernTextInput@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColAccent
                        FillPortions: =1
                        Height: =40
                        Placeholder: ="Search products..."
                  - drpCategoryHom:
                      Control: DropDown@0.0.45
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =ColAccent
                        FontSize: =14
                        Height: =40
                        Items: =["All","Laptops","Phones","Tablets","Audio","Monitors","Peripherals","Wearables"]
                        OnChange: =Set(locSelectedCategoryHom, drpCategoryHom.Selected.Value)
                        Width: =200
            - conSummaryHom:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =ColBg
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - lblCountHom:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =ColTextSecondary
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =Text(CountRows(galProductsHom.AllItems)) & " Products"
                        Wrap: =false
                  - lblFilteredHom:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =ColAccent
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: |-
                          ="Filtered by: " & drpCategoryHom.Selected.Value &
                          If(txtSearchHom.Text <> "", "  •  Search: """ & txtSearchHom.Text & """", "")
                        Visible: =drpCategoryHom.Selected.Value <> "All" || txtSearchHom.Text <> ""
            - galProductsHom:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Fill: =ColBg
                  Items: |-
                    =Filter(
                      colProductsHom,
                      (drpCategoryHom.Selected.Value = "All" || Category = drpCategoryHom.Selected.Value) &&
                      (txtSearchHom.Text = "" || Name in txtSearchHom.Text || Category in txtSearchHom.Text)
                    )
                  ShowScrollbar: =false
                  TemplatePadding: =8
                  TemplateSize: =100
                  Width: =Parent.Width
                Children:
                  - conGalCardHom:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.Semilight
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =Parent.TemplateHeight - 8
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        PaddingBottom: =12
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =Parent.TemplateWidth - 24
                        X: =12
                        Y: =4
                      Children:
                        - conGalLeftHom:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblGalNameHom:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    AutoHeight: =true
                                    Color: =ColTextPrimary
                                    FontWeight: =FontWeight.Semibold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: =ThisItem.Name
                                    Wrap: =false
                              - lblGalCategoryHom:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    AutoHeight: =true
                                    Color: =ColTextSecondary
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =ThisItem.Category
                                    Wrap: =false
                        - conGalRightHom:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Height: =70
                              LayoutAlignItems: =LayoutAlignItems.End
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblGalPriceHom:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.End
                                    AutoHeight: =true
                                    Color: =ColAccent
                                    FontWeight: =FontWeight.Bold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =18
                                    Text: ="$" & Text(ThisItem.Price, "#,##0")
                                    Wrap: =false
                              - badgeGalStatusHom:
                                  Control: Badge@0.0.24
                                  Properties:
                                    AlignInContainer: =AlignInContainer.End
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    Content: =ThisItem.Status
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    ThemeColor: =StatusThemeColor(ThisItem.Status)
